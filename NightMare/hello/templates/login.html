<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Логин</title>
    <style>
        body{
            background: rgb(25, 25, 25);
        }

        .Container{
            width: 700px;
            height: 600px;
            background: rgb(50, 50, 50);
            margin: auto;
            margin-top: 75px;
            text-align: center;
            border-radius: 35px;
            border: 5px solid #1c2e92;
        }

            .TextStyleLog{
                font-size: 30px;
                color: Snow;
                font-family: cursive;
            }

            input{
                width: 450px;
                height: 65px;
                border-radius: 15px;
                border: 5px solid #1c2e92;
                margin-top: 30px;
                background: rgb(150, 150, 150);
                font-size: 20px;
                color: Snow;
                font-family: cursive;
                transition: 0.3s ease;

                &:hover{
                    border: 5px solid #6274d8;
                }

                &::placeholder{
                    color: rgb(225, 225, 225);
                    font-family: Arial Black;
                }

                &:focus{outline:none}
            }

            button{
                position: absolute;
                width: 250px;
                height: 65px;
                border-radius: 20px;
                border: 5px solid #1c2e92;
                background: #0073d0;
                font-size: 30px;
                color: Snow;
                font-family: Arial Black;
                margin-top: 185px;
                margin-left: -350px;
                cursor: pointer;
                transition: 0.3s ease;

                &:hover{
                    border: 5px solid #4456ba;
                }
            }


        .Reg{
            position: absolute;
            margin-top: -309px;
            margin-left: 645px;
            font-size: 50px;
            color: Snow;
            font-family: Arial Black;
            border-bottom: 7px solid #1c2e92;
        }
    </style>
</head>
<body>
<form method="POST">
    {% csrf_token %}
    <div class="Container">
        <h2 class="TextStyleLog">LOGIN</h2>

        <input type="text" name="Name" placeholder="Name:">
        <input type="password" name="Password" placeholder="Password:">

        <button>CONFIRM</button>

        <a href="http://localhost:8000/register/"><h2 class="Reg">R</h2></a>
    </div>
</form>
</body>
</html>
