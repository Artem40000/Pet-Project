<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hello</title>
    <style>
        html{
            height: 100%;
        }

        body{
            background: AntiqueWhite;
            background-repeat: no-repeat;
        }

        .Container{
            width: 1000px;
            height: 1000px;
            background: Snow;
            margin: auto;
            text-align: center;
            border-radius: 20px;
            border: 5px solid Indigo;
            text-align: center;
        }

        .TextStyleName{
            font-size: 40px;
            font-family: Verdana;
            line-height: 10px;
        }

        .ContainerName{
            width: 350px;
            height: 225px;
            background: Snow;
            margin-top: -800px;
            margin-left: 320px;
            text-align: center;
            border-radius: 20px;
            border: 5px solid Indigo;
            text-align: center;
        }

        .Action{
            position: absolute;
            font-size: 30px;
            margin-left: -110px;
            margin-top: 60px;
        }

        .BookOne{
            width: 300px;
            height: 400px;
            background-image: url("https://фантазеры.рф/wa-data/public/shop/products/66/89/178966/images/443507/443507.250x0.jpg");
            background-size: cover;
        }

        .BookTwo{
            width: 300px;
            height: 400px;
            margin-top: 50px;
            background-image: url("https://mybook.ru/storage/public/books/bf/cb/bfcb240c-2ead-305c-80ab-0fdf97cb04d7/cover.jpg");
            background-size: cover;
        }

        .BookThree{
            width: 300px;
            height: 400px;
            margin-left: auto;
            margin-top: -870px;
            background-image: url("https://mybook.ru/storage/public/books/f8/d1/f8d10024-9821-3fff-916f-a235ac6049ad/cover.jpg");
            background-size: cover;
        }

        .BookFour{
            width: 300px;
            height: 400px;
            margin-left: auto;
            margin-top: 50px;
            background-image: url("https://mybook.ru/storage/public/books/46/c4/46c44321-ddc3-358e-a172-667da8212af7/cover.jpg");
            background-size: cover;
        }

        p{
            font-size: 20px;
            line-height: 840px;
        }

    </style>
</head>
<body>
<form method="POST">
    <div class="Container">
            <h2>Книги</h2>
            <div class="BookOne">
                <a href="http://127.0.0.1:8000/Mymy/{{person.name}}">
                <p>Иван Тургенев "Муму"</p>
                </a>
            </div>

            <div class="BookTwo">
                <a href="http://127.0.0.1:8000/Poselok/page=1/{{person.name}}">
                <p>Кир Булычев "Поселок"</p>
                </a>
            </div>

            <div class="BookThree">
                <a href="http://127.0.0.1:8000/Jatva/page=1/{{person.name}}">
                <p>Лора Кейли "Жатва"</p>
                </a>
            </div>

            <div class="BookFour">
                <a href="http://127.0.0.1:8000/LesGrimm/page=1/{{person.name}}">
                <p>Кэтрин Парди "Лес Гримм"</p>
                </a>
            </div>

        <div class="ContainerName">
            <h2>Аккаунт</h2>
            <h2 class="TextStyleName">{{person.name}}</h2>
            <a href="http://127.0.0.1:8000/edit/{{person.name}}">Изменить</a>
            <a href="http://127.0.0.1:8000/delete/{{person.name}}">Удалить</a>
            <a class="Action" href="http://127.0.0.1:8000/register/">Register</a>
        </div>
    </div>
</form>
</body>
</html>
