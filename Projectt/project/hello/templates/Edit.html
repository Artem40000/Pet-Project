<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <style>
        html{
            height: 100%;
        }

        body{
            background-image: url("https://img.freepik.com/premium-photo/full-pink-moon-black-water-night-sky-photorealistic-cinematic-look_1100672-5693.jpg?semt=ais_hybrid&w=740");
            background-size: cover;
        }

        .ButtonRegister:hover{
            background: Magenta;
            transition: 0.2s linear;
        }

        input:hover{
            border-radius: 10px;
            border: 3px solid Navy;
        }

        input{
            border-radius: 10px;
            border: 3px solid Magenta;
            width: 300px;
            height: 40px;
            margin-top: 40px;
            background: WhiteSmoke;
        }

        .Container{
            width: 500px;
            height: 600px;
            background: rgb(75, 0, 130, 0.1);
            backdrop-filter: blur(10px);
            margin: auto;
            text-align: center;
            border-radius: 25px;
            border: 5px solid Indigo;
            color: Snow;
        }

        .ButtonConfirm{
            position: absolute;
            width: 100px;
            height: 50px;
            background: DarkMagenta;
            border-radius: 15px;
            border: 0px solid;
            color: Snow;
            margin-top: 130px;
            margin-left: -200px;
        }

        .Login{
            position: absolute;
            margin-top: 210px;
            margin-left: -170px;
            text-decoration: none;
            color: Cyan;
        }
    </style>
</head>
<body>
<form method="POST" action="http://127.0.0.1:8000/edit/{{person.name}}">
    {% csrf_token %}
    <div class="Container">
        <h2>Edit</h2>

        <input type="text" name="name" placeholder="{{person.name}}">

        <input type="number" name="age" placeholder="{{person.age}}">

        <input type="password" name="password" placeholder="{{person.password}}">

        <button class="ButtonConfirm">CONFIRM</button>
    </div>
</form>
</body>
</html>
