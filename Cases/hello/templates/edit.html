<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Редактирование</title>
    <style>
        body{
            background: rgb(25, 25, 25);
        }

        .Container{
            width: 600px;
            height: 400px;
            margin: auto;
            background: rgb(50, 50, 50);
            text-align: center;
            border-radius: 40px;
            margin-top: 50px;
        }

        input{
            width: 450px;
            height: 50px;
            background: rgb(150, 150, 150);
            border-radius: 15px;
            margin-top: 30px;
            border: 0;
        }

        input:hover{
            background: Snow;
            transition: 0.2s ease-in;
        }

        input:focus{
            outline: none;
        }


        button{
            width: 200px;
            height: 50px;
            background: rgb(75, 75, 75);
            border-radius: 20px;
            font-size: 30px;
            text-align: center;
            font-family: Arial Black;
            color: Snow;
            border: 0;
            cursor: pointer;
            margin-top: 50px;
        }
    </style>
</head>
<body>
<form method="POST" action="http://localhost:8000/prime/{{person.Name}}">
    {% csrf_token %}
    <div class="Container">
        <input type="text" name="Name" placeholder="Name:" value="{{person.Name}}">
        <input type="email" name="Email" placeholder="Email:" value="{{person.Email}}">
        <input type="password" name="Password" placeholder="Password:" value="{{person.Password}}">

        <button>CONFIRM</button>
    </div>
</form>
</body>
</html>
