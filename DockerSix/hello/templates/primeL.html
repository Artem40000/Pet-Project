<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User <{{person.Name}}></title>
    <style>
        html{
            height: 100%;
        }

        body{
            height: 90%;
            background-size: auto;
            background: linear-gradient(315deg, #1B5AC3, #196760);
        }

        .Container{
            width: 800px;
            height: 600px;
            background: linear-gradient(-200deg, #c60040, #bf4ad3);
            text-align: center;
            margin: 0 auto;
            border-radius: 15px;
            border: 0px solid;
        }

        .TextStyleReg{
            font-size: 30px;
            line-height: 70px;
            font-family: Impact;
            color: Snow;
        }

        .TextStyleName{
            margin-top: -30px;
            font-size: 24px;
            line-height: 40px;
            font-family: Arial Black;
            color: Snow;
            border-bottom: 4px solid transparent;
            border-image: linear-gradient(-200deg, #ffff5e, #441794) 1;
        }

        .Info{
            position: absolute;
            width: 196px;
            height: 50px;
            background: linear-gradient(-200deg, #ffff5e, #441794);
            font-size: 20px;
            line-height: 40px;
            color: Snow;
            margin-top: -20px;
            font-family: Arial Black;
            border-right: 5px solid Indigo;
            border-bottom: 5px solid Indigo;
        }

        .Edit{
            position: absolute;
            width: 195px;
            height: 50px;
            background: linear-gradient(200deg, #ffff5e, #441794);
            font-size: 20px;
            line-height: 40px;
            color: Snow;
            margin-left: 200px;
            margin-top: -20px;
            font-family: Arial Black;
            border-right: 6px solid Indigo;
            border-bottom: 5px solid Indigo;
        }

        .Delete{
            position: absolute;
            width: 195px;
            height: 50px;
            background: linear-gradient(-200deg, #ffff5e, #441794);
            font-size: 20px;
            line-height: 40px;
            color: Snow;
            margin-left: 400px;
            margin-top: -20px;
            font-family: Arial Black;
            border-left: 6px solid Indigo;
            border-bottom: 5px solid Indigo;
        }

        .Reg{
            position: absolute;
            width: 195px;
            height: 50px;
            background: linear-gradient(200deg, #ffff5e, #441794);
            font-size: 20px;
            line-height: 40px;
            color: Snow;
            margin-left: 600px;
            margin-top: -20px;
            font-family: Arial Black;
            border-left: 5px solid Indigo;
            border-bottom: 5px solid Indigo;
        }

        .Info:hover,
        .Edit:hover{
            border-right: 5px solid #bf4ad3;
            border-bottom: 5px solid #bf4ad3;
        }

        .Delete:hover{
            border-left: 6px solid #bf4ad3;
            border-bottom: 5px solid #bf4ad3;
        }

        .Reg:hover{
            border-left: 5px solid #bf4ad3;
            border-bottom: 5px solid #bf4ad3;
        }

        .TextStyleInfo{
            width: 800px;
            height: 40px;
            text-align: left;
            line-height: 40px;
            font-size: 20px;
            font-family: Arial Black;
            background: #6274d8;
            display: none;
            position: absolute;
            margin-top: 15px;
            border-bottom: 5px solid #3547ab;
            border-top: 5px solid #3547ab;
            color: Snow;
        }

        .Info:hover  .TextStyleInfo{
            display: block;
        }
    </style>
</head>
<body>
<div class="Container">
    <h2 class="TextStyleReg">Hello again</h2>

    <h2 class="TextStyleName">{{ person.Name }}</h2>

    <div class="Info">
        <a><div>Информация</div></a>

        <div class="TextStyleInfo">Name: {{person.Name}}</div>
        <div class="TextStyleInfo" style="margin-top:60px">Age: {{person.Age}}</div>
        <div class="TextStyleInfo" style="margin-top:105px">Password: {{person.Password}}</div>
    </div>

    <a href="http://localhost:8000/edit/{{person.Id}}"><div class="Edit">Редактировать</div></a>

    <a href="http://localhost:8000/delete/{{person.Id}}"><div class="Delete">Удалить</div></a>

    <a href="http://localhost:8000/register/"><div class="Reg">Регистрация</div></a>
</div>
</body>
</html>
