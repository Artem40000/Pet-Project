<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Логин</title>
    <style>
        body{
            background: #434a54
        }

        .Container{
            width: 500px;
            height: 500px;
            background: #034f84;
            text-align: center;
            margin: 0 auto;
            border-radius: 10px;
            border: 0px solid;
        }

        .TextStyleLog{
            font-size: 30px;
            line-height: 50px;
            color: Snow;
            border-bottom: 5px solid Indigo;
        }

        .TextStyleReg{
            width: 50px;
            height: 50px;
            font-size: 30px;
            background: #4a89dc;
            line-height: 50px;
            border-radius: 100%;
            font-family: Arial;
        }

        .TextStyleReg:hover{
            background: #4fc1e9;
            transition: 0.2s linear;
        }

        input{
            width: 350px;
            height: 45px;
            border-radius: 10px;
            border: 3px solid Indigo;
            margin-top: 30px;
        }

        input:focus{
            outline: none;
        }

        input:hover{
            border: 3px solid SkyBlue;
        }

        button{
            width: 175px;
            height: 55px;
            border-radius: 20px;
            border: 0px solid;
            margin-top: 133px;
            font-size: 28px;
            font-family: Impact;
            color: Snow;
            background: #4fc1e9;
        }

        button:hover{
            background: #4a89dc;
            transition: 0.2s linear;
        }

        a{
            position: absolute;
            text-decoration: none;
            color: Snow;
            margin-top: 163px;
            margin-left: 100px;
        }
    </style>
</head>
<body>
<form method="POST" action="http://localhost:8000/login/">
    {% csrf_token %}
    <div class="Container">
        <h2 class="TextStyleLog">Логин</h2>

        <input type="text" name="Name" placeholder="Name: " />

        <input type="password" name="Password" placeholder="Password: " />

        <button>SIGN IN</button>

        <a href="http://localhost:8000/register/"><h2 class="TextStyleReg"> << </h2></a>
    </div>
</form>
</body>
</html>
