<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Создать задачу</title>
    <style>

    input{
        width: 350px;
        height: 50px;
        margin-top: 40px;
        border-radius: 10px;
        border: 4px solid Indigo;
    }

    button:hover{
        transition: all 0.2s ease-in;
        background: DarkMagenta;
    }


    input:hover{
        border: 4px solid SlateBlue;
    }

    .Container{
        background: Lavender;
        width: 500px;
        height: 500px;
        margin: auto;
        border: 5px solid DarkMagenta;
        border-radius: 20px;
        text-align: center;
        font-size: 20px;
    }

    button{
        width: 150px;
        height: 50px;
        margin-top: 35px;
        border: 3px;
        border-radius: 5px;
        background: Magenta;
        color: White;
        font-size: 24px;
    }
    </style>
</head>
<body>
<form method="POST" action="http://127.0.0.1:8000/CreateTask/">
{% csrf_token %}
<div class="Container">
    <h2>Создание задачи</h2>

    <input type="text" name="Name" placeholder="Название:" />

    <input type="text" name="Task" placeholder="Описание:" />

    <input type="time" name="Time"/>

    <button>Создать</button>
</div>
</form>
</body>
</html>
