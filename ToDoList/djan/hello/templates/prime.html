<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ваши Задачи</title>
    <style>
        .Container{
            width: 1500px;
            height: 100%;
            background: WhiteSmoke;
            margin: auto;
            text-align: center;
            font-size: 20px;
        }

        .ContainerName{
            width: 200px;
            height: 100%;
            background: LavenderBlush;
            border-right: 3px solid Black;
        }

        .OurTask{
            margin-left: 210px;
            margin-top: -30px;
            width: 100%;
        }

        .NameTask{
            margin-left: 220px;
            margin-top: 50px;
            color: DarkSlateGray;
            width: 1280px;
            text-align: left;
        }

        .DoTask{
            margin-left: 220px;
            margin-top: 30px;
            color: DarkSlateGray;
            width: 1280px;
            text-align: left;
        }

        .TimeTask{
            margin-left: 220px;
            margin-top: 30px;
            color: DarkSlateGray;
            width: 1280px;
            text-align: left;
        }

        .DeleteTask{
            margin-left: 220px;
            margin-top: 30px;
            color: SlateBlue;
            width: 1280px;
            text-align: left;
            border-bottom: 3px solid Indigo;
        }

        .TextStyleName{
            font-size: 30px;
            font-family: Arial Black;
            border-bottom: 3px solid Indigo;
            border-top: 3px solid Indigo;
        }

        .ContainerName > h3{
            font-size: 14px;
            font-family: Arial Black;
            text-align: left;
            margin-top: -32px;
        }

        .plus{
            font-size: 40px;
            font-weight: bold;
            display: inline-block;
            text-align: center;
            line-height: 40px;
            text-decoration: none;
            color: Indigo;
            margin-top: 20px;
            margin-left: 100px;
        }

        a{
            text-decoration: none;
            color: Red;
            font-size: 20px;
        }
    </style>
</head>
<body>
<form>
    <div class="Container">
        <div class="ContainerName">
            <h2 class="TextStyleName">
                Привет!
            </h2>

            <a class="plus" href="http://127.0.0.1:8000/Task/">+</a>

            <h3>Добавить задачу</h3>

            <h2 class="OurTask">Ваши задачи</h2>

            {% for Task in Tasks %}

            <h2 class="NameTask">Название: {{Task.Name}}</h2>

            <h2 class="DoTask">Что сделать: {{Task.Task}}</h2>

            <h2 class="TimeTask">Время: {{Task.Time}}</h2>

            <h2 class="DeleteTask"><a href="http://127.0.0.1:8000/delete/{{Task.id}}">Удалить задачу</a></h2>
            {% endfor %}
        </div>
    </div>
</form>
</body>
</html>
