<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Логин</title>
    <style>
        body{
            background: rgb(25, 25, 25);
        }

        .Container{
            width: 800px;
            height: 650px;
            margin: auto;
            margin-top: 50px;
            background: rgb(75, 75, 75);
            border-radius: 25px;
            text-align: center;
        }

        .TextStyleLogin{
            font-size: 60px;
            color: Snow;
            font-family: Arial Black;
        }

        input{
            width: 700px;
            height: 100px;
            background: rgb(125, 125, 125);
            border: 0;
            border-radius: 15px;
            margin-top: 40px;
            font-size: 30px;
            font-family: Arial Black;
            color: Snow;

            &:focus{
                outline: none;
            }

            &:hover{
                background: rgb(150, 150, 150);
                transition: 0.3s ease;
                box-shadow: 0 0 10px 0 DarkGray;
            }

            &::placeholder{
                color: rgb(200, 200, 200);
            }
        }

        button{
            position: absolute;
            width: 300px;
            height: 75px;
            border: 0;
            border-radius: 15px;
            background: #298c2d;
            margin-top: 200px;
            margin-left: -675px;
            font-family: Impact;
            font-size: 40px;
            color: Snow;
            cursor: pointer;

            &:hover{
                box-shadow: 0 0 15px 0 Lime;
                background: #4caf50;
                transition: 0.3s ease;
            }
        }

        .Register{
            position: absolute;
            width: 300px;
            height: 75px;
            border: 0;
            border-radius: 15px;
            background: #dc7500;
            margin-top: 60px;
            margin-left: 425px;
            line-height: 75px;
            font-family: Impact;
            font-size: 40px;
            color: Snow;

            &:hover{
                box-shadow: 0 0 15px 0 Orange;
                background: #ff9800;
                transition: 0.3s ease;
            }
        }

        a{
            text-decoration: none;
            width: auto;
            max-width: min-content;
        }
    </style>
</head>
<body>
<form method="POST">
    {% csrf_token %}
    <div class="Container">
        <h2 class="TextStyleLogin">LOGIN</h2>

        <input type="text" name="Name" placeholder="Name:">
        <input type="password" name="Password" placeholder="Password:">

        <button>CONFIRM</button>

        <a href="http://localhost:8000/register/"><h2 class="Register">REGISTER</h2></a>
    </div>
</form>
</body>
</html>
